[project]
name = "corvox-engine"
version = "0.1.0"
description = "Engine helper for Corvox: runs a TTS model and talks to the app over stdin/stdout."
requires-python = ">=3.10"
dependencies = ["numpy", "psutil"]

[project.optional-dependencies]
# Used by "Test on my PC": Whisper for clarity, a speaker-embedding model for voice match.
bench = ["faster-whisper>=1.0", "jiwer>=3.0", "sherpa-onnx>=1.10", "scipy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["corvox_engine"]
