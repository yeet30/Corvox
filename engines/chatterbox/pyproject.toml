# Environment for Chatterbox Multilingual. Uses CUDA PyTorch on Windows/Linux, falls back to CPU.
[project]
name = "corvox-env-chatterbox"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
# resemble-perth (Chatterbox's watermarker) imports pkg_resources, removed in setuptools 81.
dependencies = ["corvox-engine", "chatterbox-tts", "torch", "torchaudio", "setuptools<81"]

[project.optional-dependencies]
bench = ["corvox-engine[bench]"]

[tool.uv]
package = false

[tool.uv.sources]
corvox-engine = { path = "../core", editable = true }
torch = [{ index = "pytorch-cuda", marker = "sys_platform != 'darwin'" }]
torchaudio = [{ index = "pytorch-cuda", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
