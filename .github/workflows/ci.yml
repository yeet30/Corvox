# Builds and tests Corvox on every push and pull request, on all three systems.

name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: never

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libgtk-3-dev libxdo-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libx11-dev libxi-dev libxtst-dev libssl-dev

      - name: Build
        working-directory: app
        run: cargo build --locked

      - name: Test
        working-directory: app
        run: cargo test --locked

      - name: Engine code compiles
        if: runner.os == 'Linux'
        run: python3 -m compileall -q engines/core
